version: '3.8'
services:
  api:
    build: .
    ports:
      - "3344:3344"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3344
    restart: unless-stopped
    # Hits /health, which answers 200 only once Mongo is connected and still
    # responding, so `docker ps` reports "(unhealthy)" when the app is up but
    # not actually serving. node:20-slim has no curl, hence node's own fetch.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3344/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
